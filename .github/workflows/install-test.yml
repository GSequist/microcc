name: install-test

on:
  push:
    paths: [install.sh, install.ps1, pyproject.toml, tests/smoke_browser.py, src/micro_cc/tools/browser_tool_.py, .github/workflows/install-test.yml]
  schedule:
    - cron: "17 5 * * *"   # nightly: catches astral.sh / PyPI drift
  workflow_dispatch:

env:
  RAW: https://raw.githubusercontent.com/GSequist/microcc/main

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # scrubbed env: no brew, no uv, no user python on PATH, fresh HOME
      - name: install (clean env)
        run: |
          H="$(mktemp -d)"
          if [ "${{ github.event_name }}" = schedule ]; then
            env -i HOME="$H" PATH=/usr/bin:/bin:/usr/sbin:/sbin sh -c "curl -fsSL $RAW/install.sh | sh"
          else
            env -i HOME="$H" PATH=/usr/bin:/bin:/usr/sbin:/sbin sh ./install.sh
          fi
          echo "H=$H" >> "$GITHUB_ENV"
      - name: verify
        run: |
          export PATH="$H/.local/bin:/usr/bin:/bin"
          command -v microcc
          "$(HOME=$H uv tool dir)/micro-cc/bin/python" -c "import micro_cc, sys; print(sys.version)"

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12-slim", "fedora:41"]
    container: ${{ matrix.image }}
    steps:
      # bare images ship without curl; install it the way a fresh WSL distro user would
      - name: curl + ca-certs
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y curl ca-certificates
          elif command -v dnf >/dev/null; then dnf install -y curl
          else echo "unsupported distro" >&2; exit 1; fi
      - name: install via real URL
        run: curl -fsSL $RAW/install.sh | sh
      - name: verify
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v microcc
          "$(uv tool dir)/micro-cc/bin/python" -c "import micro_cc"

  linux-browser:
    # browser tool on a fresh install: WSLg-like display (xvfb) and no display (Win10 WSL / ssh)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: curl + ca-certs + xvfb
        run: apt-get update && apt-get install -y curl ca-certificates xvfb xauth
      - name: install via real URL
        run: curl -fsSL $RAW/install.sh | sh
      # test this commit's code, not whatever PyPI currently serves
      - name: overlay checkout
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --python 3.12 --force --reinstall .
      # the fix the browser tool prints when apt libs are missing (container runs as root)
      - name: chromium system deps
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          "$(uv tool dir)/micro-cc/bin/python" -m playwright install-deps chromium
      - name: browser with display
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          xvfb-run -a "$(uv tool dir)/micro-cc/bin/python" tests/smoke_browser.py
      - name: browser without display
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          env -u DISPLAY -u WAYLAND_DISPLAY "$(uv tool dir)/micro-cc/bin/python" tests/smoke_browser.py

  windows-no-wsl:
    # runner has wsl.exe but no distro: the script must fail loudly with guidance
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 must refuse cleanly
        shell: pwsh
        env:
          MICROCC_WSL_INSTALL: "0"
        run: |
          $out = (pwsh -NoProfile -File ./install.ps1 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw "expected non-zero exit; out=$out" }
          if ($out -notmatch "WSL") { throw "expected WSL guidance; code=$code out=$out" }
          $global:LASTEXITCODE = 0

  windows-autoinstall:
    # no distro on the runner: install.ps1 must set WSL up itself, then micro-cc
    # windows-2022 has no WSL kernel (wsl --install fails with 0x8000ffff); 2025 is the closest runner to a real PC
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: diagnostics
        shell: pwsh
        continue-on-error: true
        run: |
          (Get-CimInstance Win32_OperatingSystem).Caption
          wsl --status | Out-Host
          wsl --list --online | Out-Host
          $global:LASTEXITCODE = 0
      - name: install.ps1 sets up WSL and micro-cc
        shell: pwsh
        env:
          MICROCC_WSL_INSTALL: "1"
        run: |
          ./install.ps1
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "install.ps1 exited $code" }
      - name: verify inside WSL
        shell: pwsh
        run: |
          wsl -d Ubuntu -e sh -c 'export PATH=$HOME/.local/bin:$PATH; command -v microcc'
          if ($LASTEXITCODE -ne 0) { throw "microcc not found in WSL" }
          $global:LASTEXITCODE = 0
      - name: browser + computer inside WSL
        shell: pwsh
        run: |
          # this commit's code, not PyPI's
          wsl -d Ubuntu -e sh -c 'export PATH=$HOME/.local/bin:$PATH; uv tool install --python 3.12 --force --reinstall .'
          if ($LASTEXITCODE -ne 0) { throw "overlay install failed in WSL" }
          $py = (wsl -d Ubuntu -e sh -c 'export PATH=$HOME/.local/bin:$PATH; echo "$(uv tool dir)/micro-cc/bin/python"').Trim()
          # runneradmin has no passwordless sudo; apt libs go in as root
          wsl -d Ubuntu -u root -e $py -m playwright install-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright install-deps failed in WSL" }
          # Windows Chrome over CDP if reachable, else Linux Chromium
          wsl -d Ubuntu -e $py tests/smoke_browser.py
          if ($LASTEXITCODE -ne 0) { throw "browser smoke failed in WSL" }
          $global:LASTEXITCODE = 0
      - name: re-run install.ps1 (existing distro path)
        shell: pwsh
        env:
          MICROCC_WSL_INSTALL: "0"
        run: |
          ./install.ps1
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "second install.ps1 run exited $code" }
