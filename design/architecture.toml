# --- use_tool_ dispatcher ----------------------------------------------------
# Discovered tools no longer enter the API `tools` array; see notes/use-tool-dispatcher-plan.md.

[[contract]]
id = "tools-array-is-stable-across-add-and-restart"
statement = "The API tools array sent to the model is byte-identical across a search_tools add, across a fresh claude_loop call (restart) and across model turns; a discovered tool's schema reaches the model only as text in a tool result. A use_tool_ call dispatches, gates (approval/ask_user/batching) and renders on its INNER name, is validated against the catalog schema, and bad args yield an is_error result carrying that schema. The transcript stores the literal use_tool_ block."
anchors = ["src/micro_cc/claude_loop_.py::claude_loop", "src/micro_cc/tools/search_tool_.py::search_tools", "src/micro_cc/tools/use_tool_.py::resolve_call"]
assumptions = [
  "Catalog tools need no prior add. MCP servers a transcript added are found from the search_tools add calls still present in the trimmed transcript, not from process state, so they re-resolve after a restart.",
  "mcp_routing starts empty each claude_loop call and is rebuilt lazily from the transcript's adds; MCP resolution is client-side only.",
]
questions = [
  "Walk add then use_tool_ then a fresh claude_loop call: tools array bytes identical at every model call.",
  "Walk a use_tool_ call to a catalog tool that was never added: valid args run it, invalid args return an is_error result with the schema.",
  "Walk a stored use_tool_ block through normalize/reconstruct and the TUI/webui history renderers: literal in storage, inner name on screen.",
]
scenarios = ["use-tool-dispatcher"]

[[scenario]]
