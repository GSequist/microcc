# --- Mod side pane and agent observers ------------------------------------------
# Mods run third-party code on the UI thread; these boundaries keep a bad mod from
# owning layout, focus or the agent loop. See skills/customizing-micro-cc/SKILL.md.

[[contract]]
id = "mod-pane-cannot-break-layout"
statement = "A mod pane (right, top or bottom) that raises, hangs or returns bad markup is disabled and closed in the same frame: the conversation reflows to the full area, pane focus is dropped and the frame still renders. While shown, the conversation, search and selection all use the conversation's own width, rows and offset; a pane that doesn't fit beside the minimum conversation collapses; mouse inside the pane goes to the mod (except an in-progress drag-select), and a picker or question taking the prompt slot takes key focus back."
anchors = [
  "src/micro_cc/tui_native/stack_.py::HSplit",
  "src/micro_cc/tui_native/pane_.py::route_key",
  "src/micro_cc/tui_native/pane_.py::route_mouse",
  "src/micro_cc/mods_.py::render_pane",
]
assumptions = [
  "Rendering and input run on the asyncio main thread, so the SIGALRM watchdog can interrupt a hung handler.",
  "The subagent view swaps HSplit.left; nothing replaces the split itself in the root VStack.",
]
questions = [
  "Walk a pane handler that sleeps past HANG_S while focused: same-frame close, focus dropped, next frame full width.",
  "Walk a search match and a multi-row drag-select with the pane open: columns map to the left width, highlight stops at the divider.",
  "Walk a resize below MIN_LEFT + MIN_PANE while focused, and an ask_user question arriving while focused.",
]
scenarios = ["mod-pane-properties"]

[[contract]]
id = "agent-observers-cannot-affect-the-loop"
statement = "Agent-event observers see a shallow copy of each coarse loop event after the builtin handler ran; a raising, slow or hung observer disables only its mod and never propagates into do_query. Per-token deltas are never forwarded."
anchors = ["src/micro_cc/mods_.py::observe"]
assumptions = ["observe is called synchronously inside do_query's event loop on the main thread, after etype_handler."]
questions = ["Walk an observer that raises on tool_call mid-turn: the turn finishes, the transcript and tool rows are unchanged, a second mod still observes."]
scenarios = ["mod-pane-properties"]

[[link]]
from = "src/micro_cc/start_live_tui_.py::MicroTui.do_query"
to = "src/micro_cc/mods_.py::observe"
