# --- interrupted-run recovery -------------------------------------------------

[[contract]]
id = "tool-results-are-flushed-before-next-model-call"
statement = "The user message holding a turn's tool results is appended and flushed (local append, Postgres insert, registered sink) before the next model call starts, so a kill during that call loses no finished tool result."
anchors = ["src/micro_cc/claude_loop_.py::claude_loop"]
assumptions = [
  "store_msgs is append-only by position; the results message is appended once and never mutated, so the extra flush does not disturb _persisted_len, the Postgres COUNT insert or checkpoint as_of_index.",
  "pending is cleared before the flush, so a failing flush cannot make the finally answer the same calls twice.",
]
questions = [
  "Walk a store_msgs failure right after the results append: pending is already None, the error ends the run, no second results message.",
  "Walk consumer flushes on the next tool_call/final_text: the tail is empty, nothing is written twice.",
]
scenarios = ["write-ahead-tool-calls"]

[[contract]]
id = "interrupted-calls-are-named-for-the-model"
statement = "Load-time repair answers each unanswered tool_use with text that names the call and its args and says whether it is read-only (call it again) or may have partly run (check state first). It starts with the fixed REPAIR_RESULT_TEXT sentence, defaults to may-have-run for any tool not in the read-only set, and never changes message positions."
anchors = [
  "src/micro_cc/utils/msg_normalize_.py::repair_dangling_tool_use",
  "src/micro_cc/utils/msg_normalize_.py::cut_short_calls",
  "src/micro_cc/utils/tool_safety_.py::is_read_only",
]
assumptions = [
  "pg_store_.load_msgs runs the same repair, so a Postgres-backed run hands the model this text after a kill.",
  "Nothing re-runs a tool at load; the model decides.",
]
questions = [
  "Walk a use_tool_ wrapper, a memory_ add vs get, and args over the display cap.",
  "Walk the tail helper after the user continues: it stops reporting.",
]
scenarios = ["interrupted-run-recovery"]

[[contract]]
id = "inbox-mail-survives-a-crash-before-ack"
statement = "Inbox mail is appended to the transcript and flushed before it is removed from inbox.json, and a replay after a crash skips mail already in the transcript: it is neither lost nor duplicated. Mail that arrives between the peek and the ack stays pending."
anchors = [
  "src/micro_cc/start_headless_.py::_fold_mail",
  "src/micro_cc/utils/inbox_store_.py::peek_mail",
  "src/micro_cc/utils/inbox_store_.py::ack_mail",
]
assumptions = [
  "peek and ack each run under the inbox flock; ids identify mail across the two calls.",
  "The mail id tag is in the first line of the stored user message, which is how a replay recognises it.",
]
questions = [
  "Walk a crash after the flush and before the ack, and a failing flush before the ack.",
  "Walk a write_mail between peek and ack.",
]
scenarios = ["interrupted-run-recovery"]

[[contract]]
id = "summary-write-is-atomic"
statement = "summary.json is replaced by a tmp-file rename, so a crash or a concurrent reader never sees a torn checkpoint; a failed write leaves the previous one whole."
anchors = ["src/micro_cc/utils/msg_store_.py::_atomic_write_text"]
assumptions = ["tmp and target share a directory, so os.replace is atomic on the same filesystem."]
questions = ["Walk os.replace failing: old content intact, no tmp file left."]
scenarios = ["interrupted-run-recovery"]

[[contract]]
id = "killed-headless-run-resumes-cleanly"
statement = "A headless run whose stored transcript ends on an unanswered tool_use resumes with a valid transcript: the model is sent the tool-aware interrupted text, no stored row is duplicated, and a registered message sink sees the synthetic message at the right position."
anchors = ["src/micro_cc/start_headless_.py::run_headless"]
assumptions = [
