version = 1
# Import roots for the src-layout package.
source_roots = ["src"]

# --- The malleable-harness self-reload / self-heal boundaries ---------------
# Declared here because the guarantees are semantic (turn boundaries, bounded
# recovery, durability across a process replacement) and no import graph
# expresses them. See notes/self_reload.md for the design.

[[contract]]
id = "self-reload-restarts-only-at-idle"
statement = "A self-reload relaunch happens only when the app is idle, with no in-flight turn, no browser session owning the conversation, and no live subagent — never mid-turn."
anchors = ["src/micro_cc/start_live_tui_.py::MicroTui._maybe_self_reload"]
assumptions = [
  "A restart re-execs the whole process; anything in flight in the old process is lost.",
  "messages.jsonl is the durable conversation boundary and is flushed before execv.",
]
questions = [
  "Walk a change detected while a tool call is streaming, while /gui is active, and while a subagent is live — none may restart.",
  "Walk a change detected while the app is idle — it must restart and the conversation must resume from disk.",
]
scenarios = ["self-reload-properties"]

[[contract]]
id = "self-reload-detects-source-change"
statement = "A change to the harness's own .py source on disk is detected from a (mtime_ns, size) manifest, ignoring __pycache__ and non-source files; an unchanged tree yields no change."
anchors = ["src/micro_cc/utils/self_reload_.py::build_manifest"]
assumptions = ["Only a source checkout has files that change under the running process; a pip install is a no-op."]
questions = ["Walk an edit, an add, a remove, and a no-op touch — only the first three are changes."]
scenarios = ["self-reload-properties"]

[[contract]]
id = "boot-failure-recovery-is-bounded"
statement = "If the app fails to reach a running UI from an installed wheel, the supervisor reinstalls the published wheel and relaunches, at most MAX_BOOT_ATTEMPTS consecutive times; a successful boot clears the counter and a crash after boot never triggers a reinstall. On a source checkout it never reinstalls: it logs the crash and exits 1, so the dev tree is never shadowed by a wheel in site-packages."
anchors = ["src/micro_cc/self_heal_.py::main"]
assumptions = [
  "The supervisor is a separate process from the app, so a broken app module surfaces as a caught boot failure, not an ImportError killing the supervisor.",
  "note_boot_ok() is the real 'reached a running UI' signal, called from start_live_tui_.start().",
]
questions = [
  "Walk N consecutive boot failures — exactly N reinstalls then stop, no loop.",
  "Walk boot-then-later-crash — no reinstall, non-zero exit.",
  "Walk a boot that succeeds after the counter was raised — counter cleared.",
  "Walk repeated boot failures on a source checkout — zero reinstalls, zero relaunches, exit 1 each time.",
]
scenarios = ["self-reload-properties"]

[[contract]]
id = "unsent-prompt-survives-relaunch"
statement = "The unsent prompt is stashed to a sidecar before a self-reload execv and restored exactly once, in the process that comes up after the restart."
anchors = ["src/micro_cc/utils/self_reload_.py::take_pending_prompt"]
assumptions = ["The sidecar lives beside messages.jsonl in the project's own storage dir."]
questions = ["Walk a stashed prompt: restored once, then gone (never resurfacing on a later boot)."]
scenarios = ["self-reload-properties"]

[[contract]]
id = "schedule-specs-parse-like-cc"
statement = "Interval ('20m', 'every 5 minutes') and 5-field cron specs parse to a next-fire time with standard cron field syntax and dom/dow-OR semantics; invalid specs are rejected, not silently accepted."
anchors = ["src/micro_cc/tools/monitor_schedule_.py::parse_cron"]
assumptions = ["Times are local; the 1-minute floor applies to interval specs."]
questions = ["Walk an edit of the field expansion, the dow=7 alias, and the pinned-date next-run."]
scenarios = ["schedule-properties"]

[[contract]]
id = "schedule-fires-once-and-ages-out"
statement = "A one-shot schedule fires once then is deleted; a recurring schedule reschedules from now; a recurring schedule past its max age fires a final time then is deleted. Nothing fires without an interactive listener, and a stored-but-unfired schedule is never lost."
anchors = ["src/micro_cc/tools/monitor_schedule_runtime.py::tick"]
assumptions = ["The store is the project's own storage dir beside messages.jsonl; firing is a push via the same wake callback a monitor watch uses."]
questions = ["Walk a one-shot fire, a recurring fire, an aged-out fire, and a tick with no listener."]
scenarios = ["schedule-properties"]

